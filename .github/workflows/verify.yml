name: Build the compact proof

on:
  workflow_dispatch:

env:
  GRH_REPO: https://github.com/lsernau/grh-lean
  GRH_SHA: 72fead102f663d5c7a407964a13dc0cf9d977207

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: grh-lean/grh-compact
    steps:
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Fetch the proof at the pinned commit
        working-directory: ${{ github.workspace }}
        run: |
          git init -q grh-lean
          git -C grh-lean fetch -q --depth 1 "$GRH_REPO" "$GRH_SHA"
          git -C grh-lean checkout -q FETCH_HEAD
          git -C grh-lean rev-parse HEAD

      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      # Mathlib's own output comes from `cache get`; only this project's
      # output is carried between runs, which keeps the cache under 10 GB.
      - name: Restore earlier build output
        uses: actions/cache/restore@v4
        with:
          path: grh-lean/grh-compact/.lake/build
          key: grh-build-${{ env.GRH_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: grh-build-${{ env.GRH_SHA }}-

      # A job may run for 6 hours. The build stops before that so the next
      # step can save what was compiled; dispatch again to continue.
      - name: Build
        id: build
        run: |
          nproc; free -g | sed -n 2p
          set +e
          timeout -k 60 320m lake build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E '^(✖|error|\S+ \[[0-9]+/[0-9]+\])'
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "lake build exit code: $rc" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save build output
        if: always()
        uses: actions/cache/save@v4
        with:
          path: grh-lean/grh-compact/.lake/build
          key: grh-build-${{ env.GRH_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - name: Print axioms
        if: steps.build.outputs.rc == '0'
        run: |
          lake env lean scripts/PrintAxioms.lean | tee axioms.txt
          { echo '```'; cat axioms.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the build did not finish
        if: steps.build.outputs.rc != '0'
        run: exit 1
